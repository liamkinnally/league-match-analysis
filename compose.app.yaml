services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_PUBLIC_LOOKUP_ENABLED: ${RIOT_PUBLIC_LOOKUP_ENABLED:-false}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      BACKEND_AUTH_REQUIRED: ${BACKEND_AUTH_REQUIRED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      BACKEND_AUTH_REQUIRED: ${BACKEND_AUTH_REQUIRED:-false}
      PROTOTYPE_CONTACT_EMAIL: ${PROTOTYPE_CONTACT_EMAIL:-}
      RIOT_VERIFICATION_TOKEN: ${RIOT_VERIFICATION_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3416}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
