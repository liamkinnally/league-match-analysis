name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify public source allowlist
        working-directory: .
        run: python3 scripts/tests/export_policy_test.py
      - name: Validate Compose configuration
        working-directory: .
        run: docker compose --env-file .env.example config --quiet
      - name: Verify private backup job behavior
        working-directory: .
        run: python3 ops/postgres-backup/backup.test.py
      - name: Verify Docker availability
        run: docker info --format '{{.OSType}}'
      - name: Test and package backend
        working-directory: .
        run: ./scripts/verify task backend

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify frontend task
        working-directory: .
        run: ./scripts/verify task frontend

  end-to-end:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify backend-to-browser behavior
        run: ./scripts/verify ui behavior
      - name: Verify authoritative UI pixels
        run: ./scripts/verify ui visual
      - name: Stop local services
        if: always()
        run: docker compose down
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  application-containers:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify application containers with a clean database
        run: ./scripts/package-smoke
      - name: Upload packaged browser receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-browser-receipt
          path: frontend/test-results/package-smoke-*.png
          if-no-files-found: ignore
          retention-days: 7
