name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Validate Compose configuration
        working-directory: .
        run: docker compose --env-file .env.example config --quiet
      - name: Verify private backup job behavior
        working-directory: .
        run: python3 ops/postgres-backup/backup.test.py
      - name: Verify Docker availability
        run: docker info --format '{{.OSType}}'
      - name: Test and package backend
        working-directory: .
        run: ./scripts/verify task backend

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test the browser update automation
        working-directory: .
        run: |
          python3 -B -m unittest discover -s scripts/ci -p 'test_update_test_browser.py'
          bash scripts/ci/test_publish_test_browser.sh
      - name: Install locked dependencies
        run: npm ci
      - name: Verify launcher runtime and command contracts
        working-directory: .
        run: ./scripts/verify task tooling
      - name: Verify frontend task
        working-directory: .
        run: ./scripts/verify task frontend

  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install sandboxed test browser and system dependencies
        run: ./scripts/ci-browser
      - name: Verify backend-to-browser behavior
        run: ./scripts/verify ui behavior
      - name: Verify sample previews without a backend
        run: ./scripts/verify ui sample
      - name: Run visual regression tests
        run: ./scripts/verify ui visual
      - name: Stop local services
        if: always()
        run: docker compose down
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  application-containers:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install sandboxed test browser and system dependencies
        run: ./scripts/ci-browser
      - name: Verify application containers with a clean database
        run: ./scripts/package-smoke
      - name: Upload packaged browser screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-browser-screenshot
          path: frontend/test-results/package-smoke-*.png
          if-no-files-found: ignore
          retention-days: 7
