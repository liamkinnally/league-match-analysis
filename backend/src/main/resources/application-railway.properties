# Runtime secrets come from Railway, never from the image or build arguments.
server.address=0.0.0.0
server.port=${PORT:8080}
league-analysis.service-auth.required=true
# Retain one worker and attach a Railway volume at /data. Services with volumes
# cannot overlap deployments. Removing that volume requires a concurrency redesign.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
